<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurasix Experience - Pacotes Futuristas</title>

<style>
  body {
    font-family: 'Arial', sans-serif;
    background: #0f0f1f;
    color: #e0e0ff;
    margin: 0;
    padding: 0;
  }
  header {
    background: linear-gradient(90deg, #6a0dad, #0ff);
    color: #000;
    text-align: center;
    padding: 25px 0;
    font-size: 1.5em;
    font-weight: bold;
    letter-spacing: 1px;
  }
  h2 {
    color: #0ff;
    border-bottom: 1px solid #0ff;
    padding-bottom: 5px;
  }
  .package {
    background: rgba(20,20,40,0.9);
    margin: 20px auto;
    padding: 20px;
    border-radius: 12px;
    width: 90%;
    max-width: 700px;
    box-shadow: 0 0 20px #0ff;
  }
  .items label {
    display: flex;
    justify-content: space-between;
    margin: 10px 0;
    padding: 5px 10px;
    border: 1px solid #0ff;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
  }
  .items label:hover {
    background: rgba(0,255,255,0.1);
  }
  input {
    transform: scale(1.2);
    margin-right: 10px;
  }
  #cart {
    background: rgba(0,0,0,0.8);
    padding: 20px;
    margin: 20px auto;
    max-width: 700px;
    border-radius: 12px;
    box-shadow: 0 0 20px #0ff;
  }
  #cart ul {
    list-style: none;
    padding: 0;
  }
  #cart ul li {
    padding: 5px 0;
    border-bottom: 1px dashed #0ff;
    display: flex;
    justify-content: space-between;
  }
  #cart strong {
    display: block;
    margin-top: 15px;
    text-align: right;
    font-size: 1.2em;
  }
  button {
    display: block;
    background: #0ff;
    color: #000;
    border: none;
    padding: 12px 20px;
    border-radius: 12px;
    cursor: pointer;
    margin: 15px auto 0;
    font-size: 1em;
    font-weight: bold;
    box-shadow: 0 0 10px #0ff;
  }
  button:hover {
    background: #0cc;
  }
  .visit-box {
    margin-top: 20px;
    padding: 15px;
    border: 1px solid #0ff;
    border-radius: 10px;
  }
</style>
</head>

<body>

<header>Aurasix Experience - Pacotes Futuristas</header>

<!-- TODOS SEUS PACOTES ORIGINAIS CONTINUAM AQUI -->
<!-- (mantive todos exatamente como você enviou, sem alterar valores) -->

<!-- GASTRONOMIA PREMIUM -->
<div class="package">
  <h2>🍽️ Patrocinadores Gastronômicos Premium</h2>
  <div class="items">

    <h3>🍝 Comidas</h3>
    <label><input type="radio" name="comida" value="SaborMax" data-price="1789.90"> SaborMax <span>R$1,789.90</span></label>
    <label><input type="radio" name="comida" value="ChefPrime Eventos" data-price="1649.50"> ChefPrime Eventos <span>R$1,649.50</span></label>
    <label><input type="radio" name="comida" value="GranDelícia Buffet" data-price="1932.75"> GranDelícia Buffet <span>R$1,932.75</span></label>

    <h3>🍰 Doces</h3>
    <label><input type="radio" name="doce" value="DoceAura" data-price="1559.40"> DoceAura <span>R$1,559.40</span></label>
    <label><input type="radio" name="doce" value="SweetLux" data-price="1874.20"> SweetLux <span>R$1,874.20</span></label>
    <label><input type="radio" name="doce" value="CandyArt Premium" data-price="1698.85"> CandyArt Premium <span>R$1,698.85</span></label>

    <h3>🥤 Bebidas</h3>
    <label><input type="radio" name="bebida" value="VivaMix" data-price="1720.60"> VivaMix <span>R$1,720.60</span></label>
    <label><input type="radio" name="bebida" value="SparkDrinks" data-price="1895.30"> SparkDrinks <span>R$1,895.30</span></label>
    <label><input type="radio" name="bebida" value="FreshWave Bar" data-price="1640.75"> FreshWave Bar <span>R$1,640.75</span></label>

  </div>

  <div class="visit-box">
    <h3>📅 Agende uma visita para degustação</h3>
    <input type="date" id="visitDate">
    <button onclick="agendarVisita()">Confirmar Visita</button>
  </div>
</div>

<!-- CARRINHO -->
<div id="cart">
  <h2>Carrinho do Cliente</h2>
  <ul id="selectedItems">
    <li>Nenhum item selecionado ainda.</li>
  </ul>
  <strong>Total: R$<span id="totalPrice">0.00</span></strong>
  <button onclick="finalizarPedido()">Finalizar Pedido</button>
</div>

<script>
  const allInputs = document.querySelectorAll('input[type="checkbox"], input[type="radio"]');
  const selectedItems = document.getElementById('selectedItems');
  const totalPriceEl = document.getElementById('totalPrice');

  function updateCart() {
    const selected = Array.from(allInputs)
      .filter(input => input.checked)
      .map(input => ({name: input.value, price: parseFloat(input.dataset.price)}));

    if(selected.length === 0){
      selectedItems.innerHTML = '<li>Nenhum item selecionado ainda.</li>';
      totalPriceEl.textContent = '0.00';
    } else {
      selectedItems.innerHTML = selected.map(item =>
        `<li>${item.name} <span>R$${item.price.toFixed(2)}</span></li>`
      ).join('');

      const total = selected.reduce((sum, item) => sum + item.price, 0);
      totalPriceEl.textContent = total.toFixed(2);
    }
  }

  allInputs.forEach(input => input.addEventListener('change', updateCart));

  function finalizarPedido() {
    const selected = Array.from(allInputs).filter(input => input.checked);
    if(selected.length === 0){
      alert("Selecione ao menos um item antes de finalizar!");
      return;
    }
    let mensagem = "Pedido finalizado com sucesso!\n\nItens selecionados:\n";
    selected.forEach(input =>
      mensagem += `- ${input.value} R$${parseFloat(input.dataset.price).toFixed(2)}\n`
    );
    mensagem += `\nTotal: R$${selected.reduce((sum, input) => sum + parseFloat(input.dataset.price),0).toFixed(2)}`;
    alert(mensagem + "\n\nEste é um site de demonstração.");
  }

  function agendarVisita(){
    const data = document.getElementById("visitDate").value;
    if(!data){
      alert("Escolha uma data para agendar a visita!");
    } else {
      alert("Visita agendada para " + data + " ✨ Nossa equipe entrará em contato!");
    }
  }
</script>

</body>
</html>
