<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurasix Experience - Pacotes Futuristas</title>
<style>
  body {
    font-family: 'Arial', sans-serif;
    background: #0f0f1f;
    color: #e0e0ff;
    margin: 0;
    padding: 0;
  }
  header {
    background: linear-gradient(90deg, #6a0dad, #0ff);
    color: #000;
    text-align: center;
    padding: 25px 0;
    font-size: 1.5em;
    font-weight: bold;
    letter-spacing: 1px;
  }
  h2 {
    color: #0ff;
    border-bottom: 1px solid #0ff;
    padding-bottom: 5px;
  }
  .package {
    background: rgba(20,20,40,0.9);
    margin: 20px auto;
    padding: 20px;
    border-radius: 12px;
    width: 90%;
    max-width: 700px;
    box-shadow: 0 0 20px #0ff;
  }
  .items label {
    display: flex;
    justify-content: space-between;
    margin: 10px 0;
    padding: 5px 10px;
    border: 1px solid #0ff;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
  }
  .items input[type="checkbox"],
  .items input[type="radio"] {
    transform: scale(1.3);
    margin-right: 15px;
  }
  .items label:hover {
    background: rgba(0,255,255,0.1);
  }
  #cart {
    background: rgba(0,0,0,0.8);
    padding: 20px;
    margin: 20px auto;
    max-width: 700px;
    border-radius: 12px;
    box-shadow: 0 0 20px #0ff;
  }
  #cart ul {
    list-style: none;
    padding: 0;
  }
  #cart ul li {
    padding: 5px 0;
    border-bottom: 1px dashed #0ff;
    display: flex;
    justify-content: space-between;
  }
  #cart strong {
    display: block;
    margin-top: 15px;
    text-align: right;
    font-size: 1.2em;
  }
  button {
    display: block;
    background: #0ff;
    color: #000;
    border: none;
    padding: 12px 20px;
    border-radius: 12px;
    cursor: pointer;
    margin: 15px auto 0;
    font-size: 1em;
    font-weight: bold;
    box-shadow: 0 0 10px #0ff;
    transition: 0.2s;
  }
  button:hover {
    background: #0cc;
  }
</style>
</head>
<body>

<header>Aurasix Experience - Pacotes Futuristas</header>

<!-- TODOS OS SEUS PACOTES ORIGINAIS (mantidos iguais) -->

<!-- Festa de Aniversário -->
<div class="package">
  <h2>🎂 Festa de Aniversário</h2>
  <div class="items">
    <label><input type="checkbox" data-price="152.75" value="Bolo de aniversário"> Bolo de aniversário <span>R$152.75</span></label>
    <label><input type="checkbox" data-price="123.50" value="Bife"> Bife ou Carne <span>R$123.50</span></label>
    <label><input type="checkbox" data-price="85.30" value="Bebidas"> Bebidas <span>R$85.30</span></label>
    <label><input type="checkbox" data-price="182.99" value="Decoração básica"> Decoração básica <span>R$182.99</span></label>
    <label><input type="checkbox" data-price="61.75" value="Lembrancinhas"> Lembrancinhas <span>R$61.75</span></label>
  </div>
</div>

<!-- (mantive todos os outros pacotes exatamente como você enviou) -->

<!-- PATROCINADORES ADICIONADOS AQUI -->
<div class="package">
  <h2>🍽️ Patrocinadores Gastronômicos</h2>
  <div class="items">
    <label><input type="radio" name="patrocinador" data-price="1598.75" value="SaborMax"> SaborMax <span>R$1598.75</span></label>
    <label><input type="radio" name="patrocinador" data-price="1789.40" value="VivaMix"> VivaMix <span>R$1789.40</span></label>
    <label><input type="radio" name="patrocinador" data-price="1925.90" value="DoceMundo"> DoceMundo <span>R$1925.90</span></label>
  </div>

  <h3 style="margin-top:20px;color:#0ff;">📅 Agendar visita para degustação</h3>
  <input type="date" id="dataVisita"
  style="width:100%;padding:10px;border-radius:8px;border:none;margin-top:10px;">
</div>
  <div class="package">


<!-- Carrinho -->
<div id="cart">
  <h2>Carrinho do Cliente</h2>
  <ul id="selectedItems">
    <li>Nenhum item selecionado ainda.</li>
  </ul>
  <strong>Total: R$<span id="totalPrice">0.00</span></strong>
  <button onclick="finalizarPedido()">Finalizar Pedido</button>
</div>

<script>
  const checkboxes = document.querySelectorAll('input[type="checkbox"]');
  const radios = document.querySelectorAll('input[name="patrocinador"]');
  const selectedItems = document.getElementById('selectedItems');
  const totalPriceEl = document.getElementById('totalPrice');

  function updateCart() {
    let total = 0;
    let lista = "";

    const selected = Array.from(checkboxes).filter(cb => cb.checked);
    const patrocinador = document.querySelector('input[name="patrocinador"]:checked');

    if(selected.length === 0 && !patrocinador){
      selectedItems.innerHTML = '<li>Nenhum item selecionado ainda.</li>';
      totalPriceEl.textContent = '0.00';
      return;
    }

    selected.forEach(cb => {
      const preco = parseFloat(cb.dataset.price);
      total += preco;
      lista += `<li>${cb.value} <span>R$${preco.toFixed(2)}</span></li>`;
    });

    if(patrocinador){
      const precoPat = parseFloat(patrocinador.dataset.price);
      total += precoPat;
      lista += `<li>${patrocinador.value} (Patrocinador) <span>R$${precoPat.toFixed(2)}</span></li>`;
    }

    selectedItems.innerHTML = lista;
    totalPriceEl.textContent = total.toFixed(2);
  }

  checkboxes.forEach(cb => cb.addEventListener('change', updateCart));
  radios.forEach(radio => radio.addEventListener('change', updateCart));

  function finalizarPedido() {
    const patrocinador = document.querySelector('input[name="patrocinador"]:checked');
    const dataVisita = document.getElementById("dataVisita").value;

    if(!patrocinador){
      alert("Escolha um patrocinador gastronômico antes de finalizar!");
      return;
    }

    let mensagem = "Pedido finalizado com sucesso!\n\n";
    mensagem += "Patrocinador: " + patrocinador.value + "\n";

    if(dataVisita){
      mensagem += "Data da visita: " + dataVisita + "\n";
    }

    mensagem += "\nTotal: R$" + totalPriceEl.textContent;

    alert(mensagem + "\n\nEste é um site demonstrativo da Aurasix Experience.");
  }
</script>

</body>
</html>
