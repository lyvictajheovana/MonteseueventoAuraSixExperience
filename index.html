<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurasix Experience - Monte seu Pacote</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 0;
    }

    header {
      background: #6a0dad;
      color: white;
      text-align: center;
      padding: 20px 0;
    }

    h2 {
      color: #6a0dad;
    }

    .package {
      background: white;
      margin: 20px auto;
      padding: 20px;
      border-radius: 8px;
      width: 90%;
      max-width: 600px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .items label {
      display: block;
      margin: 5px 0;
    }

    #summary {
      background: #fffae6;
      padding: 15px;
      margin: 20px auto;
      width: 90%;
      max-width: 600px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      font-weight: bold;
      font-size: 18px;
      text-align: center;
    }

    button {
      background: #6a0dad;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #4b006e;
    }
  </style>
</head>

<body>

<header>
  <h1>Aurasix Experience</h1>
  <p>Monte seu pacote personalizado!</p>
</header>

<!-- FESTA -->
<div class="package">
  <h2>🎂 Festa de Aniversário</h2>
  <div class="items">
    <label><input type="checkbox" data-price="150"> Bolo de aniversário - R$150</label>
    <label><input type="checkbox" data-price="120"> Bife ou Carne - R$120</label>
    <label><input type="checkbox" data-price="80"> Bebidas - R$80</label>
    <label><input type="checkbox" data-price="180"> Decoração básica - R$180</label>
    <label><input type="checkbox" data-price="60"> Lembrancinhas - R$60</label>
  </div>
</div>

<!-- CONFRATERNIZAÇÃO -->
<div class="package">
  <h2>🥳 Confraternização</h2>
  <div class="items">
    <label><input type="checkbox" data-price="100"> Pizzas variadas - R$100</label>
    <label><input type="checkbox" data-price="150"> Drinks - R$150</label>
    <label><input type="checkbox" data-price="100"> Música ambiente - R$100</label>
    <label><input type="checkbox" data-price="200"> Mesas e cadeiras - R$200</label>
  </div>
</div>

<!-- COMEMORAÇÃO -->
<div class="package">
  <h2>🎉 Comemoração Especial</h2>
  <div class="items">
    <label><input type="checkbox" data-price="90"> Doces e sobremesas - R$90</label>
    <label><input type="checkbox" data-price="120"> Saladas e pratos leves - R$120</label>
    <label><input type="checkbox" data-price="80"> Flores na decoração - R$80</label>
    <label><input type="checkbox" data-price="400"> Fotógrafo - R$400</label>
  </div>
</div>

<!-- REUNIÃO -->
<div class="package">
  <h2>👫 Reunião entre Amigos</h2>
  <div class="items">
    <label><input type="checkbox" data-price="90"> Lanches - R$90</label>
    <label><input type="checkbox" data-price="100"> Bebidas - R$100</label>
    <label><input type="checkbox" data-price="80"> Jogos e entretenimento - R$80</label>
    <label><input type="checkbox" data-price="50"> Playlist personalizada - R$50</label>
  </div>
</div>

<!-- BALADINHA -->
<div class="package">
  <h2>💃 Baladinha</h2>
  <div class="items">
    <label><input type="checkbox" data-price="180"> Drinks variados - R$180</label>
    <label><input type="checkbox" data-price="250"> Luzes e decoração moderna - R$250</label>
    <label><input type="checkbox" data-price="500"> DJ ou playlist animada - R$500</label>
    <label><input type="checkbox" data-price="200"> Espaço VIP - R$200</label>
  </div>
</div>

<!-- GASTRONOMIA PREMIUM -->
<div class="package">
  <h2>🍽️ Orçamento Gastronômico Premium</h2>
  <div class="items">

    <h3>🍝 Comidas</h3>
    <label><input type="radio" name="comida" data-price="1789.90"> SaborMax - R$ 1.789,90</label>
    <label><input type="radio" name="comida" data-price="1649.50"> ChefPrime Eventos - R$ 1.649,50</label>
    <label><input type="radio" name="comida" data-price="1932.75"> GranDelícia Buffet - R$ 1.932,75</label>

    <h3>🍰 Doces</h3>
    <label><input type="radio" name="doce" data-price="1559.40"> DoceAura - R$ 1.559,40</label>
    <label><input type="radio" name="doce" data-price="1874.20"> SweetLux - R$ 1.874,20</label>
    <label><input type="radio" name="doce" data-price="1698.85"> CandyArt Premium - R$ 1.698,85</label>

    <h3>🥤 Bebidas</h3>
    <label><input type="radio" name="bebida" data-price="1720.60"> VivaMix - R$ 1.720,60</label>
    <label><input type="radio" name="bebida" data-price="1895.30"> SparkDrinks - R$ 1.895,30</label>
    <label><input type="radio" name="bebida" data-price="1640.75"> FreshWave Bar - R$ 1.640,75</label>

    <h3>📅 Agende uma visita para degustação</h3>
    <input type="date" id="dataVisita">
    <br>
    <button onclick="confirmarVisita()">Confirmar Visita</button>

  </div>
</div>

<div id="summary">Total do Orçamento: R$ 0.00</div>

<script>
function confirmarVisita() {
  const data = document.getElementById("dataVisita").value;
  if(data) {
    alert("Visita agendada para: " + data + " ✨ Nossa equipe entrará em contato!");
  } else {
    alert("Selecione uma data 😊");
  }
}

const inputs = document.querySelectorAll("input");

inputs.forEach(input => {
  input.addEventListener("change", calcularTotal);
});

function calcularTotal() {
  let total = 0;

  const selecionados = document.querySelectorAll("input:checked");

  selecionados.forEach(item => {
    if(item.dataset.price) {
      total += parseFloat(item.dataset.price);
    }
  });

  document.getElementById("summary").innerHTML =
    "Total do Orçamento: R$ " + total.toFixed(2);
}
</script>

</body>
</html>
